<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Shopfront: a client-side routed product catalog.">
<title>Shopfront | Product Catalog</title>
<style>
:root{--ink:#1d2433;--mute:#667085;--line:#e3e7ee;--bg:#f6f7f9;--brand:#2563eb;--ok:#12805c}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg)}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);z-index:5}
nav{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;gap:20px;align-items:center}
nav .logo{font-weight:800;font-size:1.2rem;color:var(--ink);text-decoration:none;margin-right:auto}
nav a{color:var(--mute);text-decoration:none;font-weight:600}
nav a.active{color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
input,select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:1rem;background:#fff}
input[type=search]{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card a{color:inherit;text-decoration:none}
.thumb{height:180px;display:grid;place-items:center;background:#fff}
.thumb img{max-height:100%;max-width:100%;object-fit:contain}
.card h3{font-size:.98rem;margin:0;line-height:1.3}
.price{font-weight:800}
.cat{color:var(--mute);font-size:.85rem;text-transform:capitalize}
.btn{border:0;background:var(--brand);color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem}
.btn.ghost{background:#eaf0fe;color:var(--brand)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:32px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px}
.detail .thumb{height:340px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.msg{padding:40px;text-align:center;color:var(--mute)}
.skeleton{height:300px;border-radius:12px;background:linear-gradient(90deg,#eceff4,#f7f8fa,#eceff4);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:700px){.detail{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<header><nav aria-label="Main">
  <a class="logo" href="#/">Shopfront</a>
  <a href="#/" data-route="/">Catalog</a>
  <a href="#/cart" data-route="/cart">Cart (<span id="count">0</span>)</a>
  <a href="#/about" data-route="/about">About</a>
</nav></header>
<main id="view" tabindex="-1"></main>

<script>
/* ---------- Module: data (API + fallback) ---------- */
const Data = (() => {
  const API = "https://fakestoreapi.com/products";
  const FALLBACK = [
    {id:1,title:"Everyday Backpack",price:49.9,category:"bags",description:"Water-resistant 20L backpack with a padded laptop sleeve.",image:""},
    {id:2,title:"Cotton Crew T-Shirt",price:15.5,category:"clothing",description:"Soft, breathable 100% cotton tee in a relaxed fit.",image:""},
    {id:3,title:"Wireless Earbuds",price:59,category:"electronics",description:"Bluetooth 5.3 earbuds with 24-hour battery life.",image:""},
    {id:4,title:"Steel Water Bottle",price:22,category:"home",description:"Insulated 750ml bottle that keeps drinks cold for 24 hours.",image:""},
    {id:5,title:"Desk Lamp",price:34.25,category:"home",description:"Dimmable LED lamp with three colour temperatures.",image:""},
    {id:6,title:"Running Shoes",price:79,category:"clothing",description:"Lightweight trainers with a cushioned, grippy sole.",image:""}
  ];
  let cache = null;
  async function all() {
    if (cache) return cache;
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error(res.status);
      cache = await res.json();
    } catch { cache = FALLBACK; }   // graceful offline fallback
    return cache;
  }
  return { all, byId: async id => (await all()).find(p => p.id === Number(id)) };
})();

/* ---------- Module: cart (state + persistence) ---------- */
const Cart = (() => {
  let items = {};
  try { items = JSON.parse(localStorage.getItem("cart") || "{}"); } catch {}
  const save = () => { try { localStorage.setItem("cart", JSON.stringify(items)); } catch {} updateCount(); };
  return {
    add(p){ items[p.id] = items[p.id] || {p, qty:0}; items[p.id].qty++; save(); },
    remove(id){ delete items[id]; save(); },
    list: () => Object.values(items),
    count: () => Object.values(items).reduce((n,i) => n + i.qty, 0),
    total: () => Object.values(items).reduce((n,i) => n + i.qty * i.p.price, 0)
  };
})();
function updateCount(){ document.getElementById("count").textContent = Cart.count(); }

/* ---------- Helpers ---------- */
const money = n => "$" + n.toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = p => p.image
  ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" width="180" height="180" onerror="this.replaceWith(document.createTextNode('No image'))">`
  : `<span style="color:#98a2b3">No image</span>`;
const view = document.getElementById("view");

/* ---------- Views ---------- */
async function catalogView() {
  view.innerHTML = `<div class="tools">
      <input type="search" id="q" placeholder="Search products" aria-label="Search products">
      <select id="cat" aria-label="Filter by category"><option value="">All categories</option></select>
      <select id="sort" aria-label="Sort"><option value="">Sort: featured</option><option value="lo">Price: low to high</option><option value="hi">Price: high to low</option></select>
    </div><div id="list" class="grid">${'<div class="skeleton"></div>'.repeat(4)}</div>`;
  const products = await Data.all();
  const cat = document.getElementById("cat");
  [...new Set(products.map(p => p.category))].forEach(c => cat.insertAdjacentHTML("beforeend", `<option>${esc(c)}</option>`));

  const list = document.getElementById("list");
  function draw() {
    const q = document.getElementById("q").value.toLowerCase();
    const sort = document.getElementById("sort").value;
    let rows = products.filter(p => (!cat.value || p.category === cat.value) && p.title.toLowerCase().includes(q));
    if (sort) rows = [...rows].sort((a,b) => sort === "lo" ? a.price - b.price : b.price - a.price);
    list.innerHTML = rows.length ? rows.map(p => `
      <article class="card">
        <a href="#/product/${p.id}"><div class="thumb">${img(p)}</div><h3>${esc(p.title)}</h3></a>
        <span class="cat">${esc(p.category)}</span>
        <span class="price">${money(p.price)}</span>
        <button class="btn" data-add="${p.id}">Add to cart</button>
      </article>`).join("") : `<p class="msg">No products match your search. Try a different word or category.</p>`;
  }
  let t; document.getElementById("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(draw, 200); }); // debounce
  cat.addEventListener("change", draw);
  document.getElementById("sort").addEventListener("change", draw);
  draw();
}

async function productView(id) {
  const p = await Data.byId(id);
  if (!p) return notFound();
  document.title = p.title + " | Shopfront";
  view.innerHTML = `<p><a href="#/">Back to catalog</a></p>
    <div class="detail"><div class="thumb">${img(p)}</div>
    <div><span class="cat">${esc(p.category)}</span><h1>${esc(p.title)}</h1>
    <p class="price" style="font-size:1.5rem">${money(p.price)}</p>
    <p>${esc(p.description)}</p><button class="btn" data-add="${p.id}">Add to cart</button></div></div>`;
}

function cartView() {
  const rows = Cart.list();
  view.innerHTML = rows.length ? `<h1>Your cart</h1>` + rows.map(({p, qty}) => `
    <div class="row"><span>${esc(p.title)} × ${qty}</span>
    <span>${money(p.price * qty)} <button class="btn ghost" data-remove="${p.id}">Remove</button></span></div>`).join("")
    + `<div class="row"><b>Total</b><b>${money(Cart.total())}</b></div>`
    : `<p class="msg">Your cart is empty. <a href="#/">Browse the catalog</a> to add items.</p>`;
}

const aboutView = () => view.innerHTML = `<h1>About this project</h1>
  <p>Shopfront is a capstone project: a modular, client-side routed product catalog built with plain HTML, CSS and JavaScript. Products load from a public REST API with a local fallback.</p>`;
const notFound = () => view.innerHTML = `<p class="msg">That page doesn't exist. <a href="#/">Go to the catalog</a>.</p>`;

/* ---------- Module: router (hash-based, no reload) ---------- */
const routes = [
  [/^\/$/, catalogView],
  [/^\/product\/(\d+)$/, productView],
  [/^\/cart$/, cartView],
  [/^\/about$/, aboutView]
];
async function router() {
  const path = location.hash.slice(1) || "/";
  document.title = "Shopfront | Product Catalog";
  document.querySelectorAll("nav [data-route]").forEach(a => a.classList.toggle("active", a.dataset.route === path));
  for (const [re, fn] of routes) {
    const m = path.match(re);
    if (m) { await fn(m[1]); view.focus(); window.scrollTo(0, 0); return; }
  }
  notFound();
}

/* Event delegation for add/remove buttons */
document.addEventListener("click", async e => {
  const add = e.target.closest("[data-add]");
  const rem = e.target.closest("[data-remove]");
  if (add) {
    Cart.add(await Data.byId(add.dataset.add));
    add.textContent = "Added"; setTimeout(() => add.textContent = "Add to cart", 900);
  }
  if (rem) { Cart.remove(rem.dataset.remove); cartView(); }
});

window.addEventListener("hashchange", router);
updateCount();
router();
</script>
</body>
</html>
